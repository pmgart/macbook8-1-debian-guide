# MacBook8,1 internal speakers for PipeWire / WirePlumber 0.5 (installed by audio/scripts/pipewire-speakers.sh).
#
# The speaker PCM (card PCH, device 2: "CS4208 Speaker", 4ch / 44.1 kHz / S16LE only) is not part
# of any ACP profile, so this card is switched to raw-PCM mode: WirePlumber creates one node per PCM,
# event-driven, so the speaker node appears whenever the card does (no cold-boot race).
#   device 0 playback -> headphones (analog DAC 0x02 -> jack 0x10)
#   device 0 capture  -> internal microphone
#   device 2 playback -> MacBook Speakers (TDM converter 0x0a -> class-D amps)
# Only this card is affected; HDMI audio keeps its normal profile handling.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1b.0" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
  {
    matches = [ { object.path = "alsa:pcm:PCH:2:playback" } { alsa.name = "CS4208 Speaker" } ]
    actions = {
      update-props = {
        node.name                       = "mb81_speakers"
        node.description                = "MacBook Speakers"
        audio.format                    = "S16LE"
        audio.rate                      = 44100
        audio.channels                  = 4
        audio.position                  = [ FL FR RL RR ]
        # stereo sources are copied to the rear pair so all four amps play
        channelmix.upmix                = true
        channelmix.upmix-method         = "simple"
        api.alsa.period-size            = 1024
        api.alsa.headroom               = 1024
        # keep the TDM stream open: every reopen re-runs the speaker prepare sequence
        node.pause-on-idle              = false
        session.suspend-timeout-seconds = 0
        priority.driver                 = 2000
        priority.session                = 2000
      }
    }
  }
  {
    matches = [ { object.path = "alsa:pcm:PCH:0:playback" } ]
    actions = { update-props = { node.description = "MacBook Headphones" } }
  }
  {
    matches = [ { object.path = "alsa:pcm:PCH:0:capture" } ]
    actions = { update-props = { node.description = "MacBook Microphone" } }
  }
]
